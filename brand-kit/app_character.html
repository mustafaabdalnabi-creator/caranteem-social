<html><head><meta charset="utf-8"><style>
@font-face{font-family:TJ;font-weight:700;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-700-normal.woff2)}
@font-face{font-family:TJ;font-weight:800;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-800-normal.woff2)}
@font-face{font-family:TJ;font-weight:900;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-900-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:TJ;position:relative;
 background:repeating-linear-gradient(180deg,#C8102E 0 26px,#a50d26 26px 30px,#d8233f 30px 34px,#C8102E 34px 52px)}
.floor{position:absolute;left:0;right:0;top:1640px;bottom:0;background:linear-gradient(#7d0a1c,#5a0714)}
.shade{position:absolute;inset:0;background:radial-gradient(70% 55% at 60% 45%,rgba(255,255,255,.18),rgba(0,0,0,.18))}
#phone{position:absolute;left:452px;top:300px;width:600px;height:1230px;border-radius:78px;background:#111;
 box-shadow:-20px 30px 60px rgba(0,0,0,.35),inset 0 0 0 6px #2b2b2e;transform-origin:50% 100%}
#scr{position:absolute;left:20px;top:20px;right:20px;bottom:20px;border-radius:60px;overflow:hidden;background:#fff}
#scr img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top}
.isl{position:absolute;left:50%;top:34px;width:170px;height:46px;margin-left:-85px;border-radius:30px;background:#000;z-index:5}
.rip{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:8px solid #C8102E;z-index:6;opacity:0}
#end{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,#26262d,#0b0b0e);color:#fff;text-align:center;direction:rtl;opacity:0;z-index:4;padding-top:150px}
#end img{position:static;width:330px;height:auto}
.e1{font-size:76px;font-weight:900;line-height:1.15;margin-top:60px}
.e2{font-size:40px;font-weight:800;opacity:.9;margin-top:14px}
.chips{display:flex;flex-direction:column;gap:18px;align-items:center;margin-top:50px}
.chip{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:40px;padding:14px 30px 8px;font-size:34px;font-weight:800}
.ecta{display:inline-block;margin-top:60px;color:#fff;background:#C8102E;border-radius:26px;padding:24px 44px 16px;font-size:44px;font-weight:900;box-shadow:0 14px 30px rgba(0,0,0,.3)}
#ch{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
#bub{position:absolute;left:40px;top:250px;direction:rtl;z-index:9;transform-origin:20% 100%}
#bub .b{background:#111114;color:#fff;font-size:46px;font-weight:900;border-radius:26px;padding:22px 30px 14px;box-shadow:0 12px 28px rgba(0,0,0,.25);white-space:nowrap;border:4px solid #fff}
.dot{position:absolute;border-radius:50%;background:#111114;border:3px solid #fff}
.it{position:absolute;filter:drop-shadow(0 14px 12px rgba(0,0,0,.35));z-index:8;opacity:0}
</style></head><body>
<div class="floor"></div><div class="shade"></div>
<div id="phone"><div id="scr"><img id="si" src="s1.jpg"><div id="end"><img src="logo_w.png"><div class="e1">قطع غيار أصلية<br>لباب بيتك</div><div class="e2">كل اللي بتحتاجه سيارتك بتطبيق واحد</div>
<div class="chips"><div class="chip">✔ مطابقة برقم الشاصي</div><div class="chip">✔ دفع عند الاستلام</div><div class="chip">✔ توصيل لكل المحافظات</div></div>
<div class="ecta">حمّل كارانتيم الآن</div></div><div class="rip" id="rip"></div></div><div class="isl"></div></div>
<svg id="ch" viewBox="0 0 1080 1920"></svg>
<div id="bub"><div class="b" id="bt"></div><div class="dot" style="width:34px;height:34px;left:150px;top:118px" id="d1"></div><div class="dot" style="width:20px;height:20px;left:178px;top:158px" id="d2"></div></div>
<img class="it" id="i0" src="o_tot.png"><img class="it" id="i1" src="o_ofilt.png"><img class="it" id="i2" src="o_afilt.png">
<img class="it" id="i3" src="c_ak.png"><img class="it" id="i4" src="c_denso2.png"><img class="it" id="i5" src="sf.png"><img class="it" id="i6" src="c_lm.png">
<script src="man2.js"></script>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-cl(x),3),back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// beats: [start, screen, bubble, tap{x,y} (in screen %), items to fly]
const B=[
 [0.3,'car.jpg','ضفت سيارتي مرة وحدة 🚗',[50,62],[]],
 [2.7,'cats.jpg','وكل القطع بتطلعلي مطابقة ✅',[40,30],[]],
 [5.1,'s5.jpg','باكج الزيت كامل 🛢️',[30,40],[0,1,2]],
 [7.7,'brk.jpg','بريكات أصلية 🛑',[25,60],[3]],
 [10.1,'s3.jpg','وبواجي دينسو الأصلية ⚡',[60,45],[4]],
 [12.5,'done.jpg','وبدفع عند الاستلام 😎',[50,40],[5,6]],
 [14.9,null,'أنا بطلب صح 😉',null,[]]];
const TOTAL=19;
// item: width, landing x,y (top-left), launch time offset
const IT=[{w:175,x:520,y:1450},{w:150,x:730,y:1560},{w:150,x:870,y:1580},{w:220,x:300,y:1610},{w:200,x:560,y:1600},{w:140,x:905,y:1420},{w:120,x:775,y:1440}];
const launch={};B.forEach(b=>b[4].forEach((k,j)=>launch[k]=b[0]+0.7+j*0.28));
function legs(){return `<path d="M-120 500 L-110 1330 L-20 1330 L-5 620 L5 620 L20 1330 L110 1330 L120 500Z" fill="#6f8fbf" stroke="#2a1d16" stroke-width="5"/><path d="M0 560 V1100" stroke="#5a77a6" stroke-width="4"/>
<path d="M-118 1320 h108 q22 0 22 30 v14 h-150 q-6 -44 20 -44Z" fill="#fff" stroke="#2a1d16" stroke-width="5"/><path d="M118 1320 h-108 q-22 0 -22 30 v14 h150 q6 -44 -20 -44Z" fill="#fff" stroke="#2a1d16" stroke-width="5"/>`}
function frame(t){
 let bi=0;for(let i=0;i<B.length;i++)if(t>=B[i][0])bi=i;const b=B[bi],lt=t-b[0];
 // phone intro
 const pin=back((t-0)/0.6);document.getElementById('phone').style.transform=`translateX(${(1-pin)*700}px) rotate(${2.5}deg)`;
 const si=document.getElementById('si');
 const scrn=b[1]||B[bi-1][1]; if(!si.src.endsWith(scrn)) si.src=scrn;
 // slight scroll feel
 si.style.transform=`translateY(${-Math.min(lt,2)*14}px)`;
 const end=document.getElementById('end');end.style.opacity=b[1]?0:ease(lt/0.4);end.style.transform=`scale(${b[1]?1:0.9+0.1*ease(lt/0.5)})`;
 const rip=document.getElementById('rip');
 if(b[3]&&lt>0.45&&lt<1.2){const p=(lt-0.45)/0.75;rip.style.opacity=1-p;rip.style.left=b[3][0]+'%';rip.style.top=b[3][1]+'%';rip.style.transform=`scale(${0.4+p*1.2})`}else rip.style.opacity=0;
 // bubble
 const bub=document.getElementById('bub');const bp=back(lt/0.35);document.getElementById('bt').textContent=b[2];
 bub.style.transform=`scale(${bp})`;bub.style.opacity=cl(lt/0.15);
 // character
 const fin=bi===B.length-1;const talk=lt<1.0&&Math.floor(t*8)%2===0;
 const w=b[3]?Math.min(ease((lt-0.05)/0.3),1-ease((lt-1.35)/0.35)):0; // point weight
 const u=fin?ease(lt/0.4):0; // celebrate weight
 const mix=(a,b2,k)=>a+(b2-a)*k;
 const aR=[mix(mix(8,72,w),148,u),mix(mix(4,98,w),160,u)];
 const aL=[mix(8,148,u),mix(4,160,u)];
 const o={m:fin?2:(talk?1:0),blink:(t%3.1)<0.12,happy:fin||bi===5,look:0.9,point:w>0.5,aR,aL,tilt:Math.sin(t*2)*1.5};
 const bob=Math.sin(t*3.2)*3;
 document.getElementById('ch').innerHTML=`<g transform="translate(240 ${560+bob})">${man(o)}</g>`;
 // items
 IT.forEach((it,k)=>{const el=document.getElementById('i'+k);const L=launch[k];
  if(L===undefined||t<L){el.style.opacity=0;return}
  const p=cl((t-L)/0.6),e=ease(p);const sx=640,sy=800;
  const x=sx+(it.x-sx)*e, y=sy+(it.y-sy)*e-Math.sin(p*Math.PI)*260; const s=0.3+0.7*e;
  el.style.opacity=1;el.style.width=it.w+'px';el.style.left=x+'px';el.style.top=y+'px';
  el.style.transform=`scale(${p<1?s:1+0.06*Math.sin(Math.min((t-L-0.6)*14,Math.PI))}) rotate(${(1-e)*-25}deg)`;});
}
window.TOTAL=TOTAL;frame(0);
</script></body></html>
