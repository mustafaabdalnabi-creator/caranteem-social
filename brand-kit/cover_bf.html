<html><head><meta charset="utf-8"><style>
@font-face{font-family:TJ;font-weight:700;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-700-normal.woff2)}
@font-face{font-family:TJ;font-weight:800;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-800-normal.woff2)}
@font-face{font-family:TJ;font-weight:900;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-900-normal.woff2)}
@font-face{font-family:TJ;font-weight:800;src:url(node_modules/@fontsource/tajawal/files/tajawal-latin-800-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:TJ;font-weight:900;src:url(node_modules/@fontsource/tajawal/files/tajawal-latin-900-normal.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;font-family:TJ;background:#000}
#st{position:absolute;inset:0}
</style></head><body><svg id="st" direction="rtl" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const R='#C8102E',R2='#E0153A',K='#0A0A0C',G='#8E8E96';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c=1.8;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const DEF=`<defs>
<radialGradient id="spot" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#26262c"/><stop offset=".6" stop-color="#0d0d10"/><stop offset="1" stop-color="#000"/></radialGradient>
<radialGradient id="spotR" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#3a0a12"/><stop offset=".7" stop-color="#0d0d10"/><stop offset="1" stop-color="#000"/></radialGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="refl"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
const BG=(f='url(#spot)')=>`<rect width="1080" height="1920" fill="${f}"/>`;
function word(txt,x,y,size,fill,p,weight=900,dir='rtl'){return `<text x="${x}" y="${y+(1-p)*40}" text-anchor="middle" direction="${dir}" font-size="${size}" font-weight="${weight}" fill="${fill}" opacity="${p}">${txt}</text>`}
function bar(lt,y,w=320){const p=eio(lt/0.5);return `<rect x="${540-w/2*p}" y="${y}" width="${w*p}" height="9" fill="${R}"/>`}
function img(h,cx,cy,s,p,refl=true){const y=cy-s/2+(1-p)*60;let o=`<g opacity="${p}"><image href="${h}" x="${cx-s/2}" y="${y}" width="${s}" height="${s}"/>`;
 if(refl)o+=`<g transform="translate(0 ${2*(y+s)}) scale(1 -1)" opacity=".18"><image href="${h}" x="${cx-s/2}" y="${y}" width="${s}" height="${s}" filter="url(#refl)"/></g>`;return o+`</g>`}
function sweep(lt,d){const sw=-600+1900*eio(lt/d);return `<rect x="${sw}" y="0" width="300" height="1920" fill="url(#sweep)" transform="skewX(-12)"/>`}
function pct(lt,y){const q=back(lt/0.35);return `<g transform="translate(540 ${y}) scale(${0.4+0.6*q})" opacity="${cl(q*2)}"><text text-anchor="middle" direction="ltr" font-size="330" font-weight="900" fill="${R2}">20%</text></g>`}
const SC=[[0,1,(t,lt)=>BG('url(#spotR)')+`<text x="540" y="470" text-anchor="middle" direction="ltr" font-size="150" font-weight="900" fill="#fff">BLACK <tspan fill="#E0153A">FRIDAY</tspan></text>`+img('o_tot.png',250,880,430,1,false)+img('c_inj.png',540,850,560,1,false)+img('sf.png',830,890,400,1,false)+`<rect x="190" y="1140" width="700" height="140" rx="18" fill="${R}"/><text x="540" y="1238" text-anchor="middle" font-size="88" font-weight="900" fill="#fff">هدية مع الزيت</text>`+word('+ خصم 20% بواجي وبريكات',540,1400,74,'#fff',1)+word('27 - 30 نوفمبر',540,1520,66,G,1,800)]];
window.CUTS=SC.map(s=>s[0]);window.TOTAL=24;
function frame(t){let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k][0])i=k;const lt=t-SC[i][0];
 let s=DEF+SC[i][2](t,lt);
 if([0,4,5,6,7].includes(i)&&lt<0.09)s+=`<rect width="1080" height="1920" fill="${i==0?'#fff':R}" opacity="${0.55*(1-lt/0.09)}"/>`;
 document.getElementById('st').innerHTML=s;}
frame(0);
</script></body></html>
