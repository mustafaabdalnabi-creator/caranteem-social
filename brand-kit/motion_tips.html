<html><head><meta charset="utf-8"><style>
@font-face{font-family:TJ;font-weight:500;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-500-normal.woff2)}
@font-face{font-family:TJ;font-weight:800;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-800-normal.woff2)}
@font-face{font-family:TJ;font-weight:900;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-900-normal.woff2)}
@font-face{font-family:TJ;font-weight:800;src:url(node_modules/@fontsource/tajawal/files/tajawal-latin-800-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:TJ;font-weight:900;src:url(node_modules/@fontsource/tajawal/files/tajawal-latin-900-normal.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0E;font-family:TJ;color:#fff}
#st{position:absolute;inset:0}
</style></head><body><svg id="st" direction="rtl" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const R='#C8102E',W=1080;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const pop=(t,t0,d=.35)=>ease((t-t0)/d);
function snow(t){let s='';for(let i=0;i<46;i++){const x=(i*233)%W+Math.sin(t*1.3+i)*18,y=((i*389)%1920+t*(60+(i%5)*22))%1920;s+=`<circle cx="${x}" cy="${y}" r="${2+(i%4)}" fill="#fff" opacity="${.12+(i%3)*.07}"/>`}return s}
function gauge(cx,cy,r,v){ // v 0..1 fuel
 const a0=Math.PI*1.15,a1=Math.PI*1.85;const a=a0+(a1-a0)*v;
 let s=`<path d="M${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A${r} ${r} 0 0 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}" stroke="#333" stroke-width="34" fill="none" stroke-linecap="round"/>`;
 s+=`<path d="M${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A${r} ${r} 0 0 1 ${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)}" stroke="${v<.25?R:'#f5b83d'}" stroke-width="34" fill="none" stroke-linecap="round"/>`;
 s+=`<line x1="${cx}" y1="${cy}" x2="${cx+(r-40)*Math.cos(a)}" y2="${cy+(r-40)*Math.sin(a)}" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/>`;
 s+=`<text x="${cx+r*Math.cos(a0)-10}" y="${cy+r*Math.sin(a0)+70}" font-size="46" font-weight="900" fill="${R}" text-anchor="middle" direction="ltr">E</text><text x="${cx+r*Math.cos(a1)+10}" y="${cy+r*Math.sin(a1)+70}" font-size="46" font-weight="900" fill="#aaa" text-anchor="middle" direction="ltr">F</text>`;
 return s}
function icon(k,cx,cy,t){
 if(k==='idle') return `<g transform="translate(${cx} ${cy})"><rect x="-150" y="-60" width="300" height="110" rx="40" fill="#2a2a30" stroke="#fff" stroke-width="6"/><rect x="-110" y="-120" width="200" height="80" rx="30" fill="#2a2a30" stroke="#fff" stroke-width="6"/><circle cx="-90" cy="55" r="34" fill="#111" stroke="#fff" stroke-width="6"/><circle cx="90" cy="55" r="34" fill="#111" stroke="#fff" stroke-width="6"/>${[0,1,2].map(i=>{const p=(t*.8+i/3)%1;return `<circle cx="${190+p*120}" cy="${20-p*60}" r="${18+p*30}" fill="#888" opacity="${.6-p*.6}"/>`}).join('')}<text x="0" y="-150" text-anchor="middle" font-size="54" font-weight="900" fill="#f5b83d" direction="ltr">${String(Math.min(15,Math.floor(t*3))).padStart(2,'0')}:00</text></g>`;
 if(k==='tire') {const p=32-Math.min(4,Math.floor(t*2));return `<g transform="translate(${cx} ${cy})"><circle r="150" fill="#1a1a1e" stroke="#fff" stroke-width="10"/><circle r="85" fill="#0B0B0E" stroke="#555" stroke-width="10"/>${[...Array(12)].map((_,i)=>`<rect x="-14" y="-162" width="28" height="30" fill="#fff" transform="rotate(${i*30})"/>`).join('')}<g transform="translate(150 -120)"><circle r="78" fill="#fff"/><text y="16" text-anchor="middle" font-size="52" font-weight="900" fill="${p<30?R:'#111'}" direction="ltr">${p}</text><text y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#555" direction="ltr">PSI</text></g></g>`}
 if(k==='trip') {const p=cl(t/1.6);return `<g transform="translate(${cx} ${cy})"><path d="M-230 60 Q-80 -120 60 20 T230 -40" stroke="#555" stroke-width="14" fill="none" stroke-dasharray="26 22"/><circle cx="-230" cy="60" r="26" fill="#fff"/><circle cx="230" cy="-40" r="26" fill="${R}"/><text x="0" y="150" text-anchor="middle" font-size="44" font-weight="800" fill="#aaa">مشوار 5 دقايق</text><g transform="translate(${-230+460*p} ${60-100*p})"><text font-size="70" text-anchor="middle" y="20">🚗</text></g></g>`}
 if(k==='oil') return `<g transform="translate(${cx} ${cy})"><path d="M0 -170 C70 -60 120 0 120 60 A120 120 0 0 1 -120 60 C-120 0 -70 -60 0 -170Z" fill="#c98a12" stroke="#fff" stroke-width="8"/><text y="70" text-anchor="middle" font-size="64" font-weight="900" fill="#0B0B0E" direction="ltr">${t<1.2?'20W-50':'0W-20'}</text><text y="250" text-anchor="middle" font-size="44" font-weight="800" fill="${t<1.2?R:'#4ade80'}">${t<1.2?'✗ ثقيل بالبرد':'✓ المعتمد لسيارتك'}</text></g>`;
 return ''}
const SL=[
 {k:'idle',n:'1',h:'تسخين طويل وهي واقفة',s:'المحرك الحديث بيكفيه دقيقة، وبعدها سوق على هدا. التسخين ربع ساعة بيحرق بنزين على الفاضي.'},
 {k:'tire',n:'2',h:'ضغط الإطارات بينزل بالبرد',s:'كل ما تبرد الدنيا، بينزل الضغط. والإطار الناقص بيخلّي السيارة تشرب أكثر. افحصه كل أسبوعين.'},
 {k:'trip',n:'3',h:'المشاوير القصيرة',s:'بالمشوار القصير المحرك ما بيلحق يسخن، والمحرك البارد بيصرف أكثر. جمّع مشاويرك قد ما بتقدر.'},
 {k:'oil',n:'4',h:'زيت مش بالعيار الصح',s:'الزيت الثقيل بيتقّل بالبرد وبيزيد الاحتكاك. استخدم العيار المعتمد لسيارتك.'},
];
const T={hook:0,hookEnd:3.4,slide:4.6,cta:0,end:0};T.cta=T.hookEnd+SL.length*T.slide;T.end=T.cta+4.2;const TOTAL=T.end+2.6;
function frame(t){let s=`<rect width="1080" height="1920" fill="#0B0B0E"/>`+snow(t);
 if(t<T.hookEnd){const p=pop(t,0);const v=.9-cl(t/2.6)*.78;
  s+=`<g opacity="${p}"><text x="540" y="430" text-anchor="middle" font-size="76" font-weight="800" fill="#ccc">❄️ بالشتا…</text><text x="540" y="560" text-anchor="middle" font-size="96" font-weight="900" fill="#fff">ليش سيارتك</text><text x="540" y="690" text-anchor="middle" font-size="96" font-weight="900" fill="${R}">بتصرف بنزين أكثر؟</text></g>`;
  s+=gauge(540,1180,300,v);
  s+=`<text x="540" y="1620" text-anchor="middle" font-size="46" font-weight="800" fill="#aaa" opacity="${pop(t,1.6)}">4 أسباب… والرابع ما حدا بينتبهله 👇</text>`;
 } else if(t<T.cta){const i=Math.floor((t-T.hookEnd)/T.slide),lt=(t-T.hookEnd)%T.slide,x=SL[i];
  const pin=pop(lt,0,.3),out=lt>T.slide-.3?1-ease((lt-(T.slide-.3))/.3):1,o=Math.min(pin,out);
  s+=`<g opacity="${o}" transform="translate(${(1-pin)*80} 0)">`;
  s+=`<circle cx="540" cy="330" r="90" fill="${R}"/><text x="540" y="365" text-anchor="middle" font-size="100" font-weight="900" fill="#fff" direction="ltr">${x.n}</text>`;
  s+=`<text x="540" y="560" text-anchor="middle" font-size="78" font-weight="900" fill="#fff">${x.h}</text>`;
  s+=icon(x.k,540,1020,lt);
  s+=`<foreignObject x="90" y="1350" width="900" height="420"><div xmlns="http://www.w3.org/1999/xhtml" style="direction:rtl;text-align:center;font-family:TJ;font-weight:800;font-size:48px;line-height:1.55;color:#ddd">${x.s}</div></foreignObject>`;
  s+=`<g>${SL.map((_,j)=>`<rect x="${380+j*90}" y="1820" width="70" height="10" rx="5" fill="${j<=i?R:'#333'}"/>`).join('')}</g></g>`;
 } else if(t<T.end){const lt=t-T.cta;
  s+=`<g opacity="${pop(lt,0)}"><text x="540" y="470" text-anchor="middle" font-size="64" font-weight="800" fill="#ccc">جهّز سيارتك للشتا</text><text x="540" y="610" text-anchor="middle" font-size="96" font-weight="900" fill="#fff">باكج الزيت</text><text x="540" y="740" text-anchor="middle" font-size="96" font-weight="900" fill="${R}">بالعيار المعتمد لسيارتك</text></g>`;
  const L=['4 لتر زيت أصلي','فلتر زيت + فلتر هوا','مطابق برقم الشاصي','توصيل لباب البيت'];
  L.forEach((l,j)=>{const q=pop(lt,.5+j*.35,.3);s+=`<g opacity="${q}" transform="translate(${(1-q)*-60} 0)"><rect x="190" y="${900+j*130}" width="700" height="100" rx="50" fill="#1d1d22" stroke="#333" stroke-width="3"/><text x="540" y="${966+j*130}" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">✓ ${l}</text></g>`});
  s+=`<g opacity="${pop(lt,2.2)}"><text x="540" y="1560" text-anchor="middle" font-size="44" font-weight="800" fill="#aaa">توتاشي من</text><text x="540" y="1690" text-anchor="middle" font-size="130" font-weight="900" fill="#fff" direction="ltr">30<tspan font-size="70" dy="-46">.90</tspan><tspan font-size="50" dy="46" fill="#aaa"> JD</tspan></text></g>`;
 } else {const lt=t-T.end;
  s+=`<g opacity="${pop(lt,0)}"><image href="logo_w.png" x="215" y="760" width="650" height="132"/><text x="540" y="1010" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">اطلب عالواتساب أو من التطبيق</text><rect x="290" y="1080" width="500" height="104" rx="52" fill="${R}"/><text x="540" y="1148" text-anchor="middle" font-size="48" font-weight="900" fill="#fff">احفظ الفيديو 🔖</text></g>`;}
 document.getElementById('st').innerHTML=s;}
window.TOTAL=TOTAL;frame(0);
</script></body></html>
